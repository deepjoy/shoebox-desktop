[workspace]
changelog_update = true
git_release_enable = false
publish = false
semver_check = false

[changelog]
header = """# Changelog

All notable changes to this project are documented in this file.
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

[[package]]
name = "shoebox-desktop"
changelog_path = "src-tauri/CHANGELOG.md"
changelog_include = ["shoebox-app-shell"]
version_group = "shoebox"

# Virtual shim. Shares version_group with shoebox-desktop so that commits
# touching repo-root files (frontend, workflows, configs) trigger a
# shoebox-desktop bump. Tag, release, publish, and its own changelog are
# all disabled — this package only exists to drive release-plz
# attribution.
[[package]]
name = "shoebox-app-shell"
version_group = "shoebox"
changelog_update = false
git_tag_enable = false
git_release_enable = false
publish = false
