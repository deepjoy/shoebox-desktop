[workspace]
changelog_update = true
git_release_enable = false
publish = false
semver_check = false

[changelog]
header = """# Changelog

All notable changes to this project are documented in this file.
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

[[package]]
name = "shoebox-desktop"
changelog_path = "src-tauri/CHANGELOG.md"
changelog_include = ["shoebox-app-shell"]

# Virtual shim. Never released — only exists so release-plz attributes
# frontend/repo-root commits to a package. See root Cargo.toml.
[[package]]
name = "shoebox-app-shell"
release = false
changelog_update = false
git_tag_enable = false
git_release_enable = false
publish = false
