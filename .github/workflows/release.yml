name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0). Leave blank to derive from Cargo.toml."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        name: Resolve tag and version
        shell: bash
        run: |
          version=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version\s*=\s*"([^"]+)"/\1/')
          input_tag="${{ inputs.tag }}"
          tag="${input_tag:-v$version}"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Input tag $tag does not match Cargo.toml version v$version. Merge the release-plz PR before dispatching."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: notes
        name: Extract changelog section
        shell: bash
        run: |
          version="${{ steps.resolve.outputs.version }}"
          if [ ! -f CHANGELOG.md ]; then
            echo "notes=Release $version" > notes.txt
          else
            awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" { capture=1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md > notes.txt
            if [ ! -s notes.txt ]; then
              echo "Release $version" > notes.txt
            fi
          fi
          {
            echo "notes<<__NOTES_EOF__"
            cat notes.txt
            echo "__NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: ${{ steps.resolve.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          draft: true
          prerelease: false

  build-and-upload:
    name: Build (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rust-target: aarch64-apple-darwin
            bundles: "--bundles app,dmg"
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundles: "--bundles nsis"
          - os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            bundles: "--bundles deb,appimage"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync versions
        run: pnpm sync-versions

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.rust-target }} ${{ matrix.bundles }}
          updaterJsonPreferNsis: true

  publish-release:
    name: Publish release
    needs: [create-release, build-and-upload]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark release as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.create-release.outputs.tag }}" --draft=false
